<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Appointments | Artistry by Haritha</title>
  <style>
    :root{--cream:#fbf5ef;--cream2:#fffaf6;--brown:#51463d;--text:#2f2925;--gold:#cf9450;--gold2:#efd2ad;--green:#347657;--red:#a44a43;--shadow:0 14px 45px rgba(81,70,61,.14)}
    *{box-sizing:border-box}body{margin:0;color:var(--text);background:radial-gradient(circle at 85% 12%,#fff 0,transparent 28%),linear-gradient(135deg,#f7eee6,#fffaf6 52%,#f4e8dd);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
    button,input,select{font:inherit}.topbar{min-height:92px;background:linear-gradient(90deg,#4b4139,#62564b);color:white;display:flex;align-items:center;padding:0 clamp(22px,5vw,72px);box-shadow:0 3px 18px #0002}.brand-logo{width:68px;height:68px;border-radius:50%;overflow:hidden;position:relative;flex:0 0 auto}.brand-logo img{position:absolute;width:927px;max-width:none;left:-22px;top:-2px}.brand{font:clamp(22px,2.2vw,34px) Georgia;margin-left:17px}.admin-label{margin-left:auto;color:#f4d6ae;letter-spacing:.12em;font-size:13px}.admin-menu{display:flex;gap:8px;margin-left:clamp(24px,5vw,70px)}.admin-menu button{border:1px solid #d7b17d66;border-radius:999px;padding:10px 18px;background:transparent;color:#fff7ee;cursor:pointer}.admin-menu button.active{color:#3c2f24;background:linear-gradient(135deg,#f4d5aa,#c99554);box-shadow:0 5px 15px #0002}.page{width:min(1180px,calc(100% - 34px));margin:30px auto;padding:28px;border:1px solid var(--gold);border-radius:25px;background:#fff9f3dd;box-shadow:var(--shadow);position:relative}.page:before{content:'✦';position:absolute;top:-15px;left:50%;transform:translateX(-50%);color:var(--gold);background:var(--cream);padding:0 16px;font-size:28px}
    h1{font:italic clamp(34px,4vw,55px) Georgia;text-align:center;margin:8px 0 5px}.sub{text-align:center;color:#665b52;margin:0 0 24px}.filters{border:1px solid var(--gold2);border-radius:18px;padding:18px;background:#fffaf7;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}.quick{display:flex;gap:10px;flex-wrap:wrap}.quick label{position:relative}.quick input{position:absolute;opacity:0}.quick span,.search{display:block;border:1px solid #d6a26b;border-radius:999px;padding:10px 18px;background:white;cursor:pointer}.quick input:checked+span{background:linear-gradient(135deg,#f0d1a6,#c9904b);color:#3d2d1f;box-shadow:0 4px 12px #a8753933}.dates{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 5px;color:#63574e}.field input,.edit-row input{border:1px solid #d5a26d;border-radius:9px;padding:10px;background:white;color:var(--text)}.search{border:0;color:white;background:linear-gradient(135deg,#a87845,#6d5036);font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}.count{font-weight:700}.logout{border:0;background:none;color:#795c43;text-decoration:underline;cursor:pointer}.list{display:grid;gap:14px}.card{border:1px solid #dfbb91;border-radius:15px;background:#fff;display:grid;grid-template-columns:120px 1fr auto;gap:18px;padding:17px;align-items:center;box-shadow:0 5px 17px #6b4e3120}.when{text-align:center;border-right:1px solid #ead2b7;padding-right:17px}.date{font-weight:700;color:#77512f}.time{font:22px Georgia;margin-top:7px}.name{font:24px Georgia;margin-bottom:5px}.meta{color:#655b54;line-height:1.6;font-size:14px}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#f8dfbd;color:#6e4a25;font-size:11px;font-weight:700;text-transform:uppercase}.actions{display:flex;gap:8px}.actions button,.save,.close{border:1px solid #c99056;border-radius:9px;padding:9px 13px;background:#fff8ef;cursor:pointer}.actions .cancel{border-color:#d6a19d;color:var(--red);background:#fff7f6}.editor{grid-column:1/-1;border-top:1px solid #eed7bc;padding-top:15px;display:none}.editor.open{display:block}.edit-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.save{background:var(--green);border-color:var(--green);color:white}.message,.empty{text-align:center;padding:30px;color:#6b5f56}.error{color:var(--red)}
    .promotion-form{max-width:820px;margin:auto;border:1px solid var(--gold2);border-radius:18px;padding:22px;background:#fffaf7}.promo-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.promotion-form select,.promotion-form input{width:100%;border:1px solid #d5a26d;border-radius:9px;padding:11px;background:white}.promotion-form .quick{margin:18px 0 12px}.promotion-form .dates{display:grid;grid-template-columns:1fr 1fr}.promotion-save{display:block;width:100%;margin-top:18px;border:0;border-radius:10px;padding:13px;background:linear-gradient(135deg,#bd8448,#765438);color:white;font-weight:700;cursor:pointer}.promo-message{text-align:center;min-height:22px;margin-top:12px}.promo-list{max-width:820px;margin:22px auto 0;display:grid;gap:10px}.promo-item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #e1c4a2;border-radius:13px;background:#fff;padding:14px}.promo-title{font:20px Georgia}.promo-remove{border:1px solid #d6a19d;border-radius:8px;padding:8px 12px;color:var(--red);background:#fff7f6;cursor:pointer}.login-wrap{min-height:calc(100vh - 92px);display:grid;place-items:center;padding:25px}.login{width:min(440px,100%);background:#fffaf6;border:1px solid var(--gold);border-radius:22px;padding:32px;box-shadow:var(--shadow)}.login h1{font-size:38px}.login .field{margin:16px 0}.login input{width:100%;border:1px solid #d5a26d;border-radius:10px;padding:13px;background:white}.login button{width:100%;margin-top:7px;border:0;border-radius:10px;padding:13px;background:linear-gradient(135deg,#bd8448,#765438);color:white;font-weight:700;cursor:pointer}.login-msg{min-height:22px;color:var(--red);text-align:center;margin-top:12px}.hidden{display:none!important}
    @media(max-width:760px){.topbar{min-height:136px;padding:9px 14px;flex-wrap:wrap}.brand-logo{width:54px;height:54px}.brand-logo img{width:736px;left:-17px;top:-2px}.brand{font-size:22px}.admin-label{font-size:10px}.admin-menu{order:4;width:100%;margin:4px 0 0}.admin-menu button{flex:1;padding:9px}.page{width:calc(100% - 20px);margin:18px auto;padding:19px 12px;border-radius:20px}h1{font-size:36px}.filters{grid-template-columns:1fr;padding:13px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.quick span{text-align:center;padding:9px 5px;font-size:12px}.dates{display:grid;grid-template-columns:1fr 1fr}.field input{width:100%}.search{grid-column:1/-1;text-align:center}.card{grid-template-columns:82px 1fr;padding:13px;gap:12px}.when{padding-right:10px}.time{font-size:17px}.name{font-size:20px}.actions{grid-column:1/-1}.actions button{flex:1}.edit-row{display:grid;grid-template-columns:1fr 1fr}.edit-row .save,.edit-row .close{grid-column:auto}.toolbar{font-size:13px}.promo-grid{grid-template-columns:1fr}.promotion-form{padding:15px}.promo-item{align-items:flex-start}.promo-title{font-size:18px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand-logo"><img src="artistry-design.png" alt="Artistry by Haritha logo"></div><div class="brand">Artistry by Haritha</div><nav id="adminMenu" class="admin-menu hidden"><button class="active" data-view="appointmentsView">Appointments</button><button data-view="promotionsView">Promotions</button></nav><div class="admin-label">ADMIN</div></header>
  <main id="loginView" class="login-wrap"><form id="loginForm" class="login"><h1>Admin Login</h1><p class="sub">Appointment management</p><div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button type="submit">SIGN IN</button><div id="loginMessage" class="login-msg"></div></form></main>
  <main id="appointmentsView" class="page hidden"><h1>Appointments</h1><p class="sub">View, reschedule or cancel customer appointments.</p>
    <section class="filters"><div class="quick"><label><input type="radio" name="period" value="today" checked><span>Today</span></label><label><input type="radio" name="period" value="week"><span>This Week</span></label><label><input type="radio" name="period" value="month"><span>This Month</span></label></div><div class="dates"><div class="field"><label for="fromDate">FROM</label><input id="fromDate" type="date"></div><div class="field"><label for="toDate">TO (OPTIONAL)</label><input id="toDate" type="date"></div><button id="search" class="search" type="button">SEARCH</button></div></section>
    <div class="toolbar"><div id="count" class="count">Loading…</div><button id="logout" class="logout">Sign out</button></div><section id="appointments" class="list"></section>
  </main>
  <main id="promotionsView" class="page hidden"><h1>Promotions</h1><p class="sub">Create a limited-time service discount for the Home page.</p><form id="promotionForm" class="promotion-form"><div class="promo-grid"><div class="field"><label for="promotionService">SERVICE</label><select id="promotionService" required><option value="">Select a service</option></select></div><div class="field"><label for="promotionDiscount">DISCOUNT %</label><input id="promotionDiscount" type="number" min="1" max="100" step="1" placeholder="Example: 15" required></div></div><div class="quick"><label><input type="radio" name="promoPeriod" value="today" checked><span>Today</span></label><label><input type="radio" name="promoPeriod" value="week"><span>This Week</span></label><label><input type="radio" name="promoPeriod" value="month"><span>This Month</span></label></div><div class="dates"><div class="field"><label for="promotionFrom">FROM</label><input id="promotionFrom" type="date"></div><div class="field"><label for="promotionTo">TO (OPTIONAL)</label><input id="promotionTo" type="date"></div></div><button class="promotion-save" type="submit">PUBLISH PROMOTION</button><div id="promotionMessage" class="promo-message"></div></form><section id="promotionList" class="promo-list"></section></main>
  <script type="module">
    import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import{addDoc,collection,deleteDoc,doc,getDocs,getFirestore,runTransaction,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
    const firebaseConfig={apiKey:'AIzaSyCC1rQLmsUUS6PunkliLn3zIPkaAqqpVdg',authDomain:'poker-splitter-3c761.firebaseapp.com',projectId:'poker-splitter-3c761',storageBucket:'poker-splitter-3c761.firebasestorage.app',messagingSenderId:'409433676179',appId:'1:409433676179:web:20ec896a2b71fe8b2af066'};
    const db=getFirestore(initializeApp(firebaseConfig)),auth=getAuth();
    const loginView=document.querySelector('#loginView'),appointmentsView=document.querySelector('#appointmentsView'),promotionsView=document.querySelector('#promotionsView'),adminMenu=document.querySelector('#adminMenu'),list=document.querySelector('#appointments'),count=document.querySelector('#count');
    const USER='Beautycare',PASSWORD_HASH='494b6738746b1ee03091bf8ae9c58e6730867a4260beda497d5cec08b04bc98f';
    let records=[];
    const SERVICES={'Bridal Makeup':['Soft Glam','Traditional Glam','Bridal Transformation','Radiant Bride','Golden Elegance','Natural Glow'],'Hair Styling':['Traditional Bridal Braid','Traditional Floral Braid','Romantic Open Curls','Elegant Messy Bun'],'Nails':['Basic Manicure','Gel Manicure','Pedicure','Gel Pedicure','Gel X','Nail Art','Gel or Acrylic Removal','Chic Monochrome Art','Festive Crimson','Kids Nail Fun','Nail Party Experience','Precision Nail Care','Group Pampering'],'Threading':['Eyebrow','Upper Lip','Chin','Neck','Forehead','Sides','Full Face'],'Waxing':['Eyebrow / Upper Lip / Chin','Neck / Forehead / Sides','Full Face','Stomach & Back','Armpit & Full Arm','Half & Full Legs','Bikini & Brazilian'],'Facials':['Express Facial','Herbal Facial','Gold / Pearl / Diamond Facial','Anti Aging Facial','Dermaplane Facial','O3 Vitamin / Bridal Facial'],'Hair Care':['Henna Application','Hair Color','Hair Cut','Layer / Step / Feather','Head Massage'],'Lashes & Draping':['Lash Lifting & Tinting','Eyebrow Tinting','Brow Lamination & Tinting','Saree Draping','Saree Preplating']};
    const pad=n=>String(n).padStart(2,'0'),dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const formatTime=m=>{const h=Math.floor(m/60),min=m%60;return`${h%12||12}:${pad(min)} ${h<12?'AM':'PM'}`};
    const blocks=(start,duration)=>{const out=[];for(let m=start;m<start+Math.ceil(duration/30)*30;m+=30)out.push(m);return out};
    async function hash(value){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));return[...new Uint8Array(bytes)].map(b=>b.toString(16).padStart(2,'0')).join('')}
    function range(kind){const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()),end=new Date(start);if(kind==='week'){const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day);end.setDate(start.getDate()+6)}else if(kind==='month'){start.setDate(1);end.setMonth(start.getMonth()+1,0)}return[dateKey(start),dateKey(end)]}
    async function load(){list.innerHTML='<div class="message">Loading appointments…</div>';try{if(!auth.currentUser)await signInAnonymously(auth);const snap=await getDocs(collection(db,'bookings'));records=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){list.innerHTML=`<div class="message error">Could not load appointments. Firestore admin read permission is required.<br>${escapeHtml(e.message)}</div>`;count.textContent='Unavailable'}}
    function selectedRange(){const from=document.querySelector('#fromDate').value,to=document.querySelector('#toDate').value;if(from)return[from,to||from];return range(document.querySelector('[name=period]:checked')?.value||'today')}
    function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function render(){const[a,b]=selectedRange();const shown=records.filter(x=>x.date>=a&&x.date<=b).sort((x,y)=>(x.date+x.startMinutes).localeCompare(y.date+y.startMinutes));count.textContent=`${shown.length} appointment${shown.length===1?'':'s'} · ${a}${a===b?'':` to ${b}`}`;list.innerHTML=shown.length?'':'<div class="empty">No appointments found for this date range.</div>';shown.forEach(x=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="when"><div class="date">${escapeHtml(x.date)}</div><div class="time">${formatTime(x.startMinutes||0)}</div></div><div><div class="name">${escapeHtml(x.fullName)}</div><div class="meta"><span class="badge">${escapeHtml(x.status||'pending')}</span> &nbsp; ${escapeHtml(x.category)} — ${escapeHtml(x.service)}<br>${escapeHtml(x.cell)} · ${x.durationMinutes||30} minutes</div></div><div class="actions"><button class="override">Override</button><button class="cancel">Cancel</button></div><div class="editor"><div class="edit-row"><div class="field"><label>NEW DATE</label><input class="new-date" type="date" value="${escapeHtml(x.date)}"></div><div class="field"><label>NEW TIME</label><input class="new-time" type="time" step="1800" value="${pad(Math.floor((x.startMinutes||0)/60))}:${pad((x.startMinutes||0)%60)}"></div><button class="save">SAVE CHANGE</button><button class="close">CLOSE</button></div><div class="edit-msg"></div></div>`;list.append(card);card.querySelector('.override').onclick=()=>card.querySelector('.editor').classList.add('open');card.querySelector('.close').onclick=()=>card.querySelector('.editor').classList.remove('open');card.querySelector('.save').onclick=()=>reschedule(x,card);card.querySelector('.cancel').onclick=()=>cancelBooking(x,card)});}
    async function reschedule(x,card){const msg=card.querySelector('.edit-msg'),newDate=card.querySelector('.new-date').value,time=card.querySelector('.new-time').value;if(!newDate||!time)return msg.textContent='Choose both a date and time.';const[h,m]=time.split(':').map(Number),newStart=h*60+m,duration=x.durationMinutes||30,oldBlocks=blocks(x.startMinutes||0,duration),newBlocks=blocks(newStart,duration);if(!confirm(`Move ${x.fullName}'s appointment to ${newDate} at ${formatTime(newStart)}?`))return;msg.textContent='Saving…';try{await runTransaction(db,async tx=>{const newRefs=newBlocks.map(n=>doc(db,'bookingSlots',`${newDate}_${String(n).padStart(4,'0')}`));const snaps=await Promise.all(newRefs.map(r=>tx.get(r)));if(snaps.some(s=>s.exists()&&s.data().bookingId!==x.id))throw new Error('That time overlaps another appointment.');oldBlocks.forEach(n=>tx.delete(doc(db,'bookingSlots',`${x.date}_${String(n).padStart(4,'0')}`)));newRefs.forEach((r,i)=>tx.set(r,{bookingId:x.id,date:newDate,startMinutes:newBlocks[i],createdAt:serverTimestamp()}));tx.update(doc(db,'bookings',x.id),{date:newDate,startMinutes:newStart,endMinutes:newStart+duration,status:'rescheduled',updatedAt:serverTimestamp()})});await load()}catch(e){msg.innerHTML=`<span class="error">${escapeHtml(e.message)}</span>`}}
    async function cancelBooking(x){if(!confirm(`Cancel ${x.fullName}'s appointment on ${x.date} at ${formatTime(x.startMinutes||0)}?`))return;try{await runTransaction(db,async tx=>{blocks(x.startMinutes||0,x.durationMinutes||30).forEach(n=>tx.delete(doc(db,'bookingSlots',`${x.date}_${String(n).padStart(4,'0')}`)));tx.update(doc(db,'bookings',x.id),{status:'cancelled',cancelledAt:serverTimestamp()})});await load()}catch(e){alert(`Cancellation failed: ${e.message}`)}}
    const serviceSelect=document.querySelector('#promotionService');Object.entries(SERVICES).forEach(([category,services])=>{const group=document.createElement('optgroup');group.label=category;services.forEach(service=>{const option=document.createElement('option');option.value=`${category}|${service}`;option.textContent=`${category} — ${service}`;group.append(option)});serviceSelect.append(group)});
    function promoRange(){const from=document.querySelector('#promotionFrom').value,to=document.querySelector('#promotionTo').value;if(from)return[from,to||from];return range(document.querySelector('[name=promoPeriod]:checked')?.value||'today')}
    async function loadPromotions(){if(!auth.currentUser)await signInAnonymously(auth);const holder=document.querySelector('#promotionList');holder.innerHTML='<div class="message">Loading promotions…</div>';try{const snap=await getDocs(collection(db,'promotions'));const promos=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.startDate.localeCompare(a.startDate));holder.innerHTML=promos.length?'':'<div class="empty">No promotions created yet.</div>';promos.forEach(p=>{const item=document.createElement('article');item.className='promo-item';item.innerHTML=`<div><div class="promo-title">${escapeHtml(p.discountPercent)}% OFF · ${escapeHtml(p.service)}</div><div class="meta">${escapeHtml(p.category)} · ${escapeHtml(p.startDate)}${p.endDate===p.startDate?'':` to ${escapeHtml(p.endDate)}`}</div></div><button class="promo-remove">REMOVE</button>`;item.querySelector('button').onclick=async()=>{if(confirm('Remove this promotion from the Home page?')){await deleteDoc(doc(db,'promotions',p.id));loadPromotions()}};holder.append(item)})}catch(e){holder.innerHTML=`<div class="message error">Could not load promotions: ${escapeHtml(e.message)}</div>`}}
    document.querySelector('#promotionForm').onsubmit=async e=>{e.preventDefault();const message=document.querySelector('#promotionMessage'),discount=Number(document.querySelector('#promotionDiscount').value),value=serviceSelect.value,[startDate,endDate]=promoRange();if(!value||discount<1||discount>100||!startDate||endDate<startDate)return message.innerHTML='<span class="error">Enter a service, discount from 1–100%, and date.</span>';const[category,service]=value.split('|');message.textContent='Publishing…';try{if(!auth.currentUser)await signInAnonymously(auth);await addDoc(collection(db,'promotions'),{category,service,discountPercent:discount,startDate,endDate,status:'active',createdAt:serverTimestamp()});message.textContent='Promotion published to the Home slide.';e.target.reset();document.querySelector('[name=promoPeriod][value=today]').checked=true;loadPromotions()}catch(error){message.innerHTML=`<span class="error">Could not publish: ${escapeHtml(error.message)}</span>`}};
    function openAdmin(){loginView.classList.add('hidden');adminMenu.classList.remove('hidden');appointmentsView.classList.remove('hidden');promotionsView.classList.add('hidden');adminMenu.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view==='appointmentsView'));load()}
    adminMenu.querySelectorAll('button').forEach(button=>button.onclick=()=>{adminMenu.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));appointmentsView.classList.toggle('hidden',button.dataset.view!=='appointmentsView');promotionsView.classList.toggle('hidden',button.dataset.view!=='promotionsView');if(button.dataset.view==='promotionsView')loadPromotions()});
    document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const user=document.querySelector('#username').value.trim(),pass=document.querySelector('#password').value,msg=document.querySelector('#loginMessage');if(user===USER&&await hash(pass)===PASSWORD_HASH){sessionStorage.setItem('abh-admin','yes');openAdmin()}else msg.textContent='Incorrect username or password.'};
    document.querySelectorAll('[name=period]').forEach(r=>r.onchange=()=>{document.querySelector('#fromDate').value='';document.querySelector('#toDate').value='';render()});document.querySelector('#search').onclick=render;document.querySelector('#fromDate').onchange=()=>document.querySelectorAll('[name=period]').forEach(r=>r.checked=false);document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('abh-admin');location.reload()};
    document.querySelectorAll('[name=promoPeriod]').forEach(r=>r.onchange=()=>{document.querySelector('#promotionFrom').value='';document.querySelector('#promotionTo').value=''});document.querySelector('#promotionFrom').onchange=()=>document.querySelectorAll('[name=promoPeriod]').forEach(r=>r.checked=false);
    if(sessionStorage.getItem('abh-admin')==='yes')openAdmin();
  </script>
</body>
</html>
